<!DOCTYPE html>
<!--
  自定义浏览器主页（方向 D：真实照片壁纸 + 轻玻璃）
  结构 index.html / 外观 style.css / 行为 app.js。
  双击可打开；也可把本文件夹作为扩展加载（见 manifest.json）。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的主页</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="veil"></div>

  <div class="stage">
    <!-- 顶部整合栏 -->
    <div class="glass topbar">
      <div class="clock" id="comp-clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date">加载中…</div>
      </div>
      <div class="weather" id="comp-weather" title="点击查看多日预报 / 切换城市">
        <span class="ico" id="weather-ico">🌤️</span>
        <div>
          <div class="temp" id="weather-temp">--°C</div>
          <div class="meta" id="weather-city">天气加载中…</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-wallpaper" title="换一张壁纸（快捷键 W）">🎲</button>
        <button id="btn-theme" title="切换 标准/明亮/深沉">🌗</button>
        <button id="btn-settings" title="设置">⚙</button>
      </div>
    </div>

    <!-- 四期④：天气详情弹窗（多日预报 + 城市搜索 + AQI），默认隐藏 -->
    <div class="glass weather-pop" id="weather-pop"></div>

    <!-- 搜索框 -->
    <div class="glass search" id="comp-search">
      <span class="engine" id="engine-label">必应 ▾</span>
      <div class="engine-menu" id="engine-menu"></div>
      <input id="search-input" placeholder="搜索，或输入算式如 1+1 …" autocomplete="off" />
      <span class="go" id="search-go">→</span>
    </div>

    <!-- 每日一句 -->
    <div class="quote" id="comp-quote">“加载中…”</div>

    <!-- 壁纸风格切换器（缩略图由 JS 填入） -->
    <div class="glass styles" id="comp-styles">
      <span class="label">壁纸</span>
      <div class="swatch" data-style="nature" title="自然"></div>
      <div class="swatch" data-style="city" title="城市"></div>
      <div class="swatch" data-style="minimal" title="极简"></div>
      <div class="swatch" data-style="abstract" title="抽象"></div>
      <div class="swatch" data-style="bing" title="必应每日壁纸（每天自动更新）">B</div>
      <button class="custom-btn" id="btn-custom-wall" title="用自己的图片">＋图</button>
    </div>

    <!-- 可拖拽卡片区：网站分组（JS 动态生成）+ 待办 -->
    <div id="cards"></div>
    <button class="add-group-btn" id="btn-add-group">＋ 分组</button>

    <!-- 底部三栏（宽屏横向并排）：待办 / 便签 / 环境音 -->
    <div class="extras">

    <!-- 待办（固定，不随分组变化） -->
    <div class="glass todo draggable" id="comp-todo" data-id="todo">
      <h3>To-do <span class="add-todo" title="添加待办">＋</span></h3>
      <div class="todo-add">
        <input id="todo-input" placeholder="写点什么…" autocomplete="off" />
        <button id="todo-add-btn">添加</button>
      </div>
      <div id="todo-list"></div>
    </div>

    <!-- 四期④：便签（随手记，自动保存） -->
    <div class="glass notes draggable" id="comp-notes" data-id="notes">
      <h3>便签 <span class="add-todo" title="清空便签">🗑</span></h3>
      <textarea id="notes-area" placeholder="随手记点什么…（自动保存）"></textarea>
    </div>

    <!-- 四期④：环境音（白/粉/棕噪音 + 雨声，纯本地生成） -->
    <div class="glass ambient draggable" id="comp-ambient" data-id="ambient">
      <h3>环境音</h3>
      <div class="amb-row">
        <select id="amb-type">
          <option value="">选择声音…</option>
          <option value="white">白噪音</option>
          <option value="pink">粉噪音</option>
          <option value="brown">棕噪音</option>
          <option value="rain">雨声</option>
          <option value="cafe">咖啡馆</option>
          <option value="waves">海浪</option>
          <option value="fire">篝火</option>
        </select>
        <button id="amb-play">▶ 播放</button>
      </div>
      <input type="range" id="amb-vol" min="0" max="1" step="0.05" value="0.5" />
    </div>

    </div><!-- /.extras -->

    <div class="hint">⠿ 拖动卡片排序　·　🎲 换壁纸　·　🌗 明暗　·　⚙ 设置　·　＋图 用自己的图　·　/ 搜索　·　? 快捷键</div>
  </div>

  <!-- ============ 设置中心（默认隐藏） ============ -->
  <div class="modal-mask" id="settings-modal">
    <div class="glass modal">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="set-close" class="x-btn">✕</button>
      </div>
      <div class="modal-body">
        <label class="row"><span>默认搜索引擎</span>
          <select id="set-engine"></select></label>
        <label class="row"><span>壁纸分类</span>
          <select id="set-wall">
            <option value="nature">自然</option>
            <option value="city">城市</option>
            <option value="minimal">极简</option>
            <option value="abstract">抽象</option>
            <option value="bing">必应每日</option>
          </select></label>
        <label class="row"><span>蒙版浓度</span>
          <input type="range" id="set-veil" min="0" max="0.8" step="0.05" /></label>
        <label class="row"><span>主题</span>
          <select id="set-theme">
            <option value="dark">深色（白字）</option>
            <option value="light">浅色（深字）</option>
          </select></label>
        <div class="row col"><span>显示组件</span>
          <label class="chk"><input type="checkbox" data-comp="clock" /> 时钟</label>
          <label class="chk"><input type="checkbox" data-comp="weather" /> 天气</label>
          <label class="chk"><input type="checkbox" data-comp="search" /> 搜索框</label>
          <label class="chk"><input type="checkbox" data-comp="quote" /> 每日一句</label>
          <label class="chk"><input type="checkbox" data-comp="styles" /> 壁纸栏</label>
          <label class="chk"><input type="checkbox" data-comp="todo" /> 待办</label>
          <label class="chk"><input type="checkbox" data-comp="notes" /> 便签</label>
          <label class="chk"><input type="checkbox" data-comp="ambient" /> 环境音</label>
        </div>
        <div class="row col"><span>数据</span>
          <div class="data-btns">
            <button id="set-export">导出备份</button>
            <button id="set-import">导入备份</button>
            <button id="set-reset" title="清空本地数据，回到初始状态">恢复默认</button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 四期③：快捷键帮助弹窗 -->
  <div class="modal-mask" id="kbd-modal">
    <div class="glass modal">
      <div class="modal-head"><h2>快捷键</h2><button id="kbd-close" class="x-btn">✕</button></div>
      <div class="modal-body">
        <div class="kbd-row"><span class="key">/</span><span>聚焦搜索框</span></div>
        <div class="kbd-row"><span class="key">↑ ↓</span><span>切换搜索引擎（搜索框聚焦时）</span></div>
        <div class="kbd-row"><span class="key">W</span><span>随机换一张壁纸</span></div>
        <div class="kbd-row"><span class="key">T</span><span>切换深色 / 浅色主题</span></div>
        <div class="kbd-row"><span class="key">?</span><span>打开 / 关闭本帮助</span></div>
        <div class="kbd-row"><span class="key">Esc</span><span>关闭所有弹窗</span></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
