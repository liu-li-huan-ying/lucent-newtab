<!DOCTYPE html>
<!--
  自定义主页 · Lucent
  结构 index.html / 外观 style.css / 行为 app.js。
  双击可打开；也可把本文件夹作为扩展加载（见 manifest.json）。

  布局分区（自上而下）：
    壁纸层 → 蒙版层 → 右上角操作 → 焦点区(时钟/天气) → 搜索 → 题记+壁纸栏 → 分组 → 工具卡 → 提示
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的主页</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 防首屏闪烁：在解析其余内容前按存档挂上 zen 状态，避免「先普通视图再跳禅模式」的闪一下 -->
  <script>
    try { var z = JSON.parse(localStorage.getItem('my-homepage-v1') || '{}'); if (z && z.zen) document.body.classList.add('zen'); } catch (e) {}
  </script>
  <!-- 壁纸双层：换图时新旧两层交叉溶解（JS 控制 opacity / transform），不再硬切 -->
  <div class="wall" id="wall-a" aria-hidden="true"></div>
  <div class="wall" id="wall-b" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <!-- ============ 图标精灵：统一 1.6px 线性图标（全站唯一图标来源，替代 emoji） ============ -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.52-6.02"/><path d="M20.5 4.4V10h-5.6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></symbol>
    <symbol id="i-zen" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="2.7"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3.5 8h17M3.5 16h17"/><circle cx="9" cy="8" r="2.4"/><circle cx="15" cy="16" r="2.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="m14.5 5.5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.8h16"/><path d="M9.5 6.8V4.6h5v2.2"/><path d="M6.4 6.8 7.3 20h9.4l.9-13.2"/><path d="M10.4 10.6v5.6M13.6 10.6v5.6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8.5 12l6 6.5"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 5.5l6 6.5-6 6.5"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4.5 12h15"/><path d="m13.5 6 6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9.4 5.5v13M14.6 5.5v13"/></symbol>
    <symbol id="i-w-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.4v2.1M12 19.5v2.1M2.4 12h2.1M19.5 12h2.1M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"/></symbol>
    <symbol id="i-w-cloud-sun" viewBox="0 0 24 24"><circle cx="8.2" cy="8.4" r="3.1"/><path d="M8.2 2.6v1.7M2.6 8.4h1.7M4.3 4.5l1.2 1.2M12.1 4.5l-1.2 1.2"/><path d="M16.6 19.8H9.4a3.9 3.9 0 0 1-.5-7.77 5.1 5.1 0 0 1 9.68 1.02 3.4 3.4 0 0 1-2 6.75Z"/></symbol>
    <symbol id="i-w-cloud" viewBox="0 0 24 24"><path d="M16.8 19H7.2a4.3 4.3 0 0 1-.55-8.56 5.6 5.6 0 0 1 10.66.9A3.6 3.6 0 0 1 16.8 19Z"/></symbol>
    <symbol id="i-w-fog" viewBox="0 0 24 24"><path d="M16.4 14.4H8a3.9 3.9 0 0 1-.5-7.76 5.1 5.1 0 0 1 9.7 1.02 3.4 3.4 0 0 1-.8 6.74Z"/><path d="M4.5 18h15M7.5 21.2h9"/></symbol>
    <symbol id="i-w-rain" viewBox="0 0 24 24"><path d="M16.4 15.2H8a3.9 3.9 0 0 1-.5-7.76 5.1 5.1 0 0 1 9.7 1.02 3.4 3.4 0 0 1-.8 6.74Z"/><path d="M8.6 18.2 7.4 21M12.5 18.2 11.3 21M16.4 18.2 15.2 21"/></symbol>
    <symbol id="i-w-snow" viewBox="0 0 24 24"><path d="M16.4 15.2H8a3.9 3.9 0 0 1-.5-7.76 5.1 5.1 0 0 1 9.7 1.02 3.4 3.4 0 0 1-.8 6.74Z"/><path d="M8.4 19.6h.01M12 21h.01M15.6 19.6h.01"/></symbol>
    <symbol id="i-w-thunder" viewBox="0 0 24 24"><path d="M16.4 14.6H8a3.9 3.9 0 0 1-.5-7.76 5.1 5.1 0 0 1 9.7 1.02 3.4 3.4 0 0 1-.8 6.74Z"/><path d="m12.6 16.6-2.5 4.2h3.3l-1.6 3"/></symbol>
    <symbol id="i-w-thermo" viewBox="0 0 24 24"><path d="M14.2 14.6V5.4a2.2 2.2 0 1 0-4.4 0v9.2a4.2 4.2 0 1 0 4.4 0Z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9.6 14.4a4.2 4.2 0 0 0 6 0l2.9-2.9a4.2 4.2 0 1 0-6-6L11.2 6.8"/><path d="M14.4 9.6a4.2 4.2 0 0 0-6 0l-2.9 2.9a4.2 4.2 0 1 0 6 6l1.3-1.3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.6" cy="10" r="1.7"/><path d="m3.6 17.2 4.9-4.9 3.6 3.6 3.1-3.1 5.2 5.2"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.4"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2.4v3.2M12 18.4v3.2M2.4 12h3.2M18.4 12h3.2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.6 21 19.4H3z"/><path d="M12 9.6v4.6M12 16.9h.01"/></symbol>
  </svg>

  <!-- ============ 右上角操作（浮动，不占主视觉流） ============ -->
  <div class="corner-actions">
    <button id="btn-wallpaper" title="换一张壁纸（快捷键 W）" aria-label="换一张壁纸"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg></button>
    <button id="btn-theme" title="切换 标准/明亮/深沉" aria-label="切换明暗浓度"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
    <button id="btn-zen" title="禅模式（快捷键 Z）" aria-label="禅模式" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-zen"/></svg></button>
    <button id="btn-settings" title="设置" aria-label="打开设置"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg></button>
  </div>

  <main class="stage">
    <!-- ---------- 焦点区：时钟 + 天气（新标签页的第一眼） ---------- -->
    <header class="hero">
      <div class="clock" id="comp-clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date">加载中…</div>
      </div>
      <button class="weather" id="comp-weather" aria-label="查看多日预报 / 切换城市">
        <span class="ico" id="weather-ico"></span>
        <span class="temp" id="weather-temp">--°C</span>
        <span class="meta" id="weather-city">天气加载中…</span>
      </button>
    </header>

    <!-- 天气详情弹窗（多日预报 + 城市搜索 + AQI），默认隐藏 -->
    <div class="glass weather-pop" id="weather-pop"></div>

    <!-- ---------- 搜索 ---------- -->
    <div class="glass search" id="comp-search">
      <span class="engine" id="engine-label" role="button" tabindex="0" aria-label="选择搜索引擎" aria-haspopup="true" aria-expanded="false"><span class="eng-txt">必应</span> <svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg></span>
      <div class="engine-menu" id="engine-menu"></div>
      <input id="search-input" placeholder="搜索，或输入算式如 1+1 …" autocomplete="off" aria-label="搜索" />
      <span class="go" id="search-go" role="button" tabindex="0" aria-label="搜索"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
    </div>

    <!-- ---------- 题记 + 壁纸栏（弱化，不抢主视觉） ---------- -->
    <div class="muse">
      <p class="quote" id="comp-quote">“加载中…”</p>
      <div class="styles" id="comp-styles">
        <div class="swatch" data-style="nature" role="button" tabindex="0" title="自然" aria-label="壁纸：自然"></div>
        <div class="swatch" data-style="city" role="button" tabindex="0" title="城市" aria-label="壁纸：城市"></div>
        <div class="swatch" data-style="minimal" role="button" tabindex="0" title="极简" aria-label="壁纸：极简"></div>
        <div class="swatch" data-style="abstract" role="button" tabindex="0" title="抽象" aria-label="壁纸：抽象"></div>
        <div class="swatch" data-style="bing" role="button" tabindex="0" title="必应每日壁纸（每天自动更新）" aria-label="壁纸：必应每日（每天自动更新）"><span>B</span></div>
        <button class="custom-btn" id="btn-custom-wall" title="用自己的图片" aria-label="上传自定义壁纸"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
    </div>

    <!-- ---------- 网站分组（JS 动态生成） ---------- -->
    <div id="cards"></div>
    <button class="add-group-btn" id="btn-add-group"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-plus"/></svg>新建分组</button>

    <!-- ---------- 工具区：待办 / 便签 / 环境音 / 番茄钟 / 日历 / 倒计时 ---------- -->
    <div class="extras">

      <div class="panel todo draggable" id="comp-todo" data-id="todo">
        <h3><span>待办</span> <span class="add-todo" role="button" tabindex="0" title="添加待办" aria-label="添加待办"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-plus"/></svg></span></h3>
        <div class="todo-add">
          <input id="todo-input" placeholder="写点什么…" autocomplete="off" aria-label="新待办内容" />
          <button id="todo-add-btn">添加</button>
        </div>
        <div id="todo-list"></div>
      </div>

      <div class="panel notes draggable" id="comp-notes" data-id="notes">
        <h3><span>便签</span> <span class="add-todo" role="button" tabindex="0" title="清空便签" aria-label="清空便签"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-trash"/></svg></span></h3>
        <textarea id="notes-area" placeholder="随手记点什么…（自动保存）" aria-label="便签内容"></textarea>
      </div>

      <div class="panel ambient draggable" id="comp-ambient" data-id="ambient">
        <h3><span>环境音</span></h3>
        <div class="amb-row">
          <select id="amb-type" aria-label="选择环境音">
            <option value="">选择声音…</option>
            <option value="white">白噪音</option>
            <option value="pink">粉噪音</option>
            <option value="brown">棕噪音</option>
            <option value="rain">雨声</option>
            <option value="cafe">咖啡馆</option>
            <option value="waves">海浪</option>
            <option value="fire">篝火</option>
          </select>
          <button id="amb-play"><svg class="ic ic-sm ic--solid" aria-hidden="true"><use href="#i-play"/></svg><span id="amb-play-text">播放</span></button>
        </div>
        <input type="range" id="amb-vol" min="0" max="1" step="0.05" value="0.5" aria-label="音量" />
      </div>

      <div class="panel pomodoro draggable" id="comp-pomodoro" data-id="pomodoro">
        <h3><span>番茄钟</span> <span class="fold" data-fold="pomodoro" role="button" tabindex="0" title="折叠 / 展开" aria-label="折叠 / 展开 番茄钟" aria-expanded="false"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg></span></h3>
        <div class="pomo-ring"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg" id="pomo-ring" cx="60" cy="60" r="52"/></svg><span class="pomo-time" id="pomo-time">25:00</span></div>
        <div class="pomo-mode" id="pomo-mode">专注</div>
        <div class="pomo-btns">
          <button id="pomo-start">开始</button>
          <button id="pomo-reset">重置</button>
        </div>
        <div class="pomo-set">
          <label>专注 <input type="number" id="pomo-work" min="1" max="120" value="25" aria-label="专注分钟数" /> 分</label>
          <label>休息 <input type="number" id="pomo-break" min="1" max="60" value="5" aria-label="休息分钟数" /> 分</label>
        </div>
      </div>

      <div class="panel calendar draggable" id="comp-calendar" data-id="calendar">
        <h3><span>日历</span><span class="h3-tools"><span class="cal-nav"><button id="cal-prev" title="上个月" aria-label="上个月"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><button id="cal-next" title="下个月" aria-label="下个月"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron-right"/></svg></button></span><span class="fold" data-fold="calendar" role="button" tabindex="0" title="折叠 / 展开" aria-label="折叠 / 展开 日历" aria-expanded="false"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg></span></span></h3>
        <div class="cal-head" id="cal-head"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="panel countdown draggable" id="comp-countdown" data-id="countdown">
        <h3><span>倒计时</span><span class="h3-tools"><span class="add-todo" id="cd-add" role="button" tabindex="0" title="添加目标" aria-label="添加倒计时"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-plus"/></svg></span><span class="fold" data-fold="countdown" role="button" tabindex="0" title="折叠 / 展开" aria-label="折叠 / 展开 倒计时" aria-expanded="false"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg></span></span></h3>
        <div class="cd-add-row" id="cd-add-row" hidden>
          <input id="cd-name" placeholder="名称，如 生日" autocomplete="off" aria-label="倒计时名称" />
          <input id="cd-date" type="date" aria-label="目标日期" />
          <button id="cd-save">保存</button>
        </div>
        <div id="cd-list"></div>
      </div>

    </div><!-- /.extras -->

    <div class="hint">拖动卡片排序　·　W 换壁纸　·　T 明暗　·　Z 禅模式　·　/ 搜索　·　? 快捷键</div>
  </main>

  <!-- ============ 设置中心（默认隐藏） ============ -->
  <div class="modal-mask" id="settings-modal">
    <div class="glass modal">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="set-close" class="x-btn" aria-label="关闭设置"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body">
        <label class="row"><span>默认搜索引擎</span>
          <select id="set-engine"></select></label>
        <div class="row col"><span>自定义搜索引擎</span>
          <div id="engine-list" class="engine-list"></div>
          <div class="engine-add">
            <input id="eng-name" placeholder="名称，如 豆瓣" autocomplete="off" aria-label="引擎名称" />
            <input id="eng-url" placeholder="搜索地址（含 {q}），如 https://search.douban.com/?q={q}" autocomplete="off" aria-label="引擎搜索地址" />
            <button id="eng-add" title="添加自定义引擎">添加</button>
          </div>
          <p class="tip">提示：地址里用 <code>{q}</code> 占位查询词；内置引擎不可删除。</p>
        </div>
        <label class="row"><span>壁纸分类</span>
          <select id="set-wall">
            <option value="nature">自然</option>
            <option value="city">城市</option>
            <option value="minimal">极简</option>
            <option value="abstract">抽象</option>
            <option value="bing">必应每日</option>
          </select></label>
        <label class="row"><span>蒙版浓度</span>
          <input type="range" id="set-veil" min="0" max="0.8" step="0.05" /></label>
        <label class="row"><span>主题</span>
          <select id="set-theme">
            <option value="dark">深色（白字）</option>
            <option value="light">浅色（深字）</option>
          </select></label>
        <label class="row"><span>时钟显示秒</span><input type="checkbox" id="set-seconds" /></label>
        <div class="row col"><span>显示组件</span>
          <label class="chk"><input type="checkbox" data-comp="clock" /> 时钟</label>
          <label class="chk"><input type="checkbox" data-comp="weather" /> 天气</label>
          <label class="chk"><input type="checkbox" data-comp="search" /> 搜索框</label>
          <label class="chk"><input type="checkbox" data-comp="quote" /> 每日一句</label>
          <label class="chk"><input type="checkbox" data-comp="styles" /> 壁纸栏</label>
          <label class="chk"><input type="checkbox" data-comp="todo" /> 待办</label>
          <label class="chk"><input type="checkbox" data-comp="notes" /> 便签</label>
          <label class="chk"><input type="checkbox" data-comp="ambient" /> 环境音</label>
          <label class="chk"><input type="checkbox" data-comp="pomodoro" /> 番茄钟</label>
          <label class="chk"><input type="checkbox" data-comp="calendar" /> 日历</label>
          <label class="chk"><input type="checkbox" data-comp="countdown" /> 倒计时</label>
        </div>
        <div class="row col"><span>数据</span>
          <div class="data-btns">
            <button id="set-export">导出备份</button>
            <button id="set-import">导入备份</button>
            <button id="set-reset" title="清空本地数据，回到初始状态">恢复默认</button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 快捷键帮助弹窗 -->
  <div class="modal-mask" id="kbd-modal">
    <div class="glass modal">
      <div class="modal-head"><h2>快捷键</h2><button id="kbd-close" class="x-btn" aria-label="关闭快捷键说明"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="modal-body">
        <div class="kbd-row"><span class="key">/</span><span>聚焦搜索框</span></div>
        <div class="kbd-row"><span class="key">↑ ↓</span><span>切换搜索引擎（搜索框聚焦时）</span></div>
        <div class="kbd-row"><span class="key">1–9</span><span>打开对应书签（书签左上角数字）</span></div>
        <div class="kbd-row"><span class="key">W</span><span>随机换一张壁纸</span></div>
        <div class="kbd-row"><span class="key">T</span><span>切换深色 / 浅色主题</span></div>
        <div class="kbd-row"><span class="key">?</span><span>打开 / 关闭本帮助</span></div>
        <div class="kbd-row"><span class="key">Esc</span><span>关闭所有弹窗</span></div>
      </div>
    </div>
  </div>

  <!-- 通用对话框容器（添加链接 / 改名 / 删除确认 / 自定义壁纸等，内容由 JS 渲染） -->
  <div class="modal-mask" id="dialog-modal">
    <div class="glass modal dialog" id="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
