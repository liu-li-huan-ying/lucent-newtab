name: Build & Release Extension

# 触发条件:
#   1. 推送 tag（形如 v1.2.0）→ 自动构建并创建 GitHub Release（含可下载 zip）
#   2. 推送到 main 分支 → 自动构建并把 zip 作为 Artifact 上传（始终有最新构件）
#   3. 手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 构建扩展压缩包
        id: build
        run: |
          python scripts/build.py --out dist
          VERSION=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 上传构件（每次 push）
        uses: actions/upload-artifact@v4
        with:
          name: lucent-newtab-v${{ steps.build.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: 创建 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lucent v${{ steps.build.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
